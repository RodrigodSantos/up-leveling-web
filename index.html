<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Hábitos gamificados: cumpra seus hábitos, ganhe XP e suba de nível." />
    <title>Up Leveling</title>
    <script>
      // Aplica o tema salvo ANTES de desenhar a página (sem isto, ela piscaria no tema padrão ao abrir).
      // Padrão: modo escuro e destaque azul. Mesmas chaves do next-themes e de src/lib/theme/accent.ts.
      try {
        var mode = localStorage.getItem('up-leveling.mode') || 'dark'
        var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.dataset.accent = localStorage.getItem('up-leveling.accent') || 'blue'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
